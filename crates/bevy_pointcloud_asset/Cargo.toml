[package]
name = "bevy_pointcloud_asset"
version = "0.1.0"
edition = "2024"
description = "Provides point cloud types for Bevy Engine"
repository = "https://github.com/rlamarche/bevy_pointcloud"
license = "MIT OR Apache-2.0"
keywords = ["bevy_pointcloud"]

[dependencies]
# bevy
bevy_app = { version = "0.19.0" }
bevy_asset = { version = "0.19.0" }
bevy_encase_derive = { version = "0.19.0" }
bevy_math = { version = "0.19.0" }
bevy_reflect = { version = "0.19.0" }
bevy_ecs = { version = "0.19.0" }
bevy_transform = { version = "0.19.0" }
bevy_derive = { version = "0.19.0" }
bevy_platform = { version = "0.19.0", default-features = false, features = [
  "std",
  "serialize",
] }

# other
bitflags = { version = "2.3", features = ["serde"] }
bytemuck = { version = "1.5" }
wgpu-types = { version = "29.0.3", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
half = { version = "2.4.1", features = ["bytemuck"] }
encase = "0.12"

[dev-dependencies]
approx = "0.5"
serde_json = "1.0.140"

[features]
default = []
## Adds serialization support through `serde`.
serialize = ["dep:serde", "wgpu-types/serde", "half/serde"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
